<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PurrRouter logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="shine" cx=".25" cy=".15" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>

  <!-- cat head: two ears + round face -->
  <g fill="#fff">
    <path d="M118 262 L128 92 Q132 72 150 82 L250 150 Z" stroke="#fff" stroke-width="24" stroke-linejoin="round"/>
    <path d="M394 262 L384 92 Q380 72 362 82 L262 150 Z" stroke="#fff" stroke-width="24" stroke-linejoin="round"/>
    <ellipse cx="256" cy="292" rx="172" ry="148"/>
  </g>
  <!-- inner ears -->
  <g fill="#f9a8d4">
    <path d="M150 210 L156 122 L214 160 Z"/>
    <path d="M362 210 L356 122 L298 160 Z"/>
  </g>

  <!-- face = Wi-Fi signal -->
  <g fill="none" stroke="url(#ink)" stroke-width="26" stroke-linecap="round">
    <path d="M168 300 A124 124 0 0 1 344 300"/>
    <path d="M205 336 A72 72 0 0 1 307 336"/>
  </g>
  <circle cx="256" cy="372" r="22" fill="url(#ink)"/>

  <!-- whiskers -->
  <g stroke="#c4b5fd" stroke-width="10" stroke-linecap="round">
    <path d="M70 330 L150 344"/>
    <path d="M74 372 L150 368"/>
    <path d="M442 330 L362 344"/>
    <path d="M438 372 L362 368"/>
  </g>
</svg>
